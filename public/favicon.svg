<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#881337" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- App Icon Base -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" filter="url(#shadow)" />
  
  <!-- Subtle inner border -->
  <rect x="7" y="7" width="114" height="114" rx="27" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2" />
  
  <!-- Stylized Kanji '漢' -->
  <text 
    x="64" 
    y="86" 
    text-anchor="middle" 
    font-size="76" 
    font-weight="bold" 
    font-family="'M PLUS Rounded 1c', 'Kosugi Maru', 'Hiragino Sans', 'Noto Sans JP', sans-serif" 
    fill="#ffffff"
    letter-spacing="-1"
  >漢</text>

  <!-- Small sakura petal accent -->
  <circle cx="98" cy="30" r="4.5" fill="#ffe4e6" opacity="0.9" />
  <circle cx="106" cy="38" r="3" fill="#ffe4e6" opacity="0.75" />
</svg>
